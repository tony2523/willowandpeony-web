name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Cloudflare serves from the domain root — never a sub-path.
      PAGES_BASE_PATH: ""
      DEPLOY_CNAME: ""
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is not set — skipping Cloudflare deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Build
        if: steps.creds.outputs.ready == 'true'
        run: |
          npm ci
          npm run build
      - name: Ensure Pages project exists
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler@4 pages project create willowandpeony --production-branch=main 2>/dev/null || true
      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler@4 pages deploy out --project-name=willowandpeony --branch=main
