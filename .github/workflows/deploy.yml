name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Production (custom domain): leave PAGES_BASE_PATH empty and set
      # DEPLOY_CNAME. Preview (github.io/<repo>): set PAGES_BASE_PATH to
      # /<repo> and leave DEPLOY_CNAME empty. Controlled via repo variables.
      PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
      DEPLOY_CNAME: ${{ vars.DEPLOY_CNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/postbuild.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
